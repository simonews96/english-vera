name: check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Tipi, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Nessuno script inline nella pagina pubblicata
        run: |
          if grep -Eq '<script[^>]*>[^<]' dist/index.html; then
            echo "dist/index.html contiene uno script inline: viola la CSP" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Giro completo nel browser
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: |
            tests/e2e/screenshots
            playwright-report
          retention-days: 7
